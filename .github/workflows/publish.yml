name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade build
      - name: Build package
        run: python -m build
      - name: Store built distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tstate
    permissions:
      id-token: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Pre-flight policy check (twelve rules)
        env:
          TMIG_POLICY: publish-policy.json
          TMIG_STATE: publish-state.json
          TMIG_PROJECT: tstate
          TMIG_VERSION: ${{ github.ref_name }}
          TMIG_TAG: ${{ github.ref_name }}
          TMIG_COMMIT: ${{ github.sha }}
          TMIG_DIST: dist
        run: |
          pip install tmig-bridge 2>/dev/null || true
          python3 -m tmig_bridge.capabilities.publisher check

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
