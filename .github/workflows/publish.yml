name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade build
      - name: Build package
        run: python -m build
      - name: Store built distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tstate
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Fetch latest publish state from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:publish-state.json > publish-state.json

      - name: Pre-flight policy check (twelve rules)
        env:
          TMIG_POLICY: publish-policy.json
          TMIG_STATE: publish-state.json
          TMIG_PROJECT: tstate
          TMIG_VERSION: ${{ github.ref_name }}
          TMIG_TAG: ${{ github.ref_name }}
          TMIG_COMMIT: ${{ github.sha }}
          TMIG_DIST: dist
        run: |
          pip install --quiet cryptography
          python3 .github/scripts/publisher.py check

      - name: Record release into state
        env:
          TMIG_POLICY: publish-policy.json
          TMIG_STATE: publish-state.json
          TMIG_PROJECT: tstate
          TMIG_VERSION: ${{ github.ref_name }}
          TMIG_TAG: ${{ github.ref_name }}
          TMIG_COMMIT: ${{ github.sha }}
          TMIG_DIST: dist
        run: |
          python3 .github/scripts/publisher.py record
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publish-state.json
          git diff --cached --quiet || git commit -m "state: record ${{ github.ref_name }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
